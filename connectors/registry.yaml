    allowed_without_approval: read_only_when_connected
    external_writes_require_approval: true

  - id: analytics
    kind: capability
    installation_status: uninstalled
    purpose: goal and funnel measurement
    live_availability:
      source: connector_runtime_probe
      probe_target: analytics
      freshness_seconds: 300
      last_observed: null
      observed_at: null
    allowed_without_approval: read_only_when_connected
    external_writes_require_approval: true

  - id: payments_or_crm
